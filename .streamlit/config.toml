[server]
# Serve streamlit_app/static/ at /app/static/... so the dashboard SPA can fetch
# its JSON with plain relative URLs (no in-iframe HTTP shim).
enableStaticServing = true

[client]
# Drop Streamlit's Deploy button + hamburger so the shell stops looking like a
# stock Streamlit app (the SPA has no such chrome). Native option, no CSS hack.
toolbarMode = "minimal"

[theme]
# Match the embedded SPA's dark palette (build_site.py :root) so the shell and
# the dashboard read as one surface; "Minimal / data-dense" direction.
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "sans_serif"
