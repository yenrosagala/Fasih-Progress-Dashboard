services:
  web:
    build: .
    image: yenrosagala/fasih-analytics:latest
    container_name: fasih-analytics
    ports:
      - "8080:8080"
    volumes:
      # Host data + config + FASIH session (session files are NOT baked into the image).
      - ./inputs:/app/inputs
      # Serve and persist refreshed payloads on the host.
      - ./outputs:/app/outputs
    environment:
      # Login gate. Change these in a .env file next to this compose file
      # (LOGIN_USER=... / LOGIN_PASSWORD=...). Both must be set to enable login.
      LOGIN_USER: ${LOGIN_USER:-admin}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-admin123}
      # Optional: enables the "Ringkas dengan AI" button on the Progress tab.
      # Set OPENROUTER_API_KEY=... in .env. Only aggregate numbers are sent to the
      # AI backend (OpenRouter), never per-sample rows.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-openai/gpt-4o-mini}
      # Space every FASIH request by this many seconds so parallel region tasks
      # don't burst and trip FASIH's 429 throttle (the retry backoff froze the
      # progress bar for minutes). The 18-req/min limiter still applies on top.
      FASIH_REQUEST_INTERVAL: ${FASIH_REQUEST_INTERVAL:-0.8}
    restart: unless-stopped
