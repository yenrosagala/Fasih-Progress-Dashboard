services:
  web:
    build: .
    image: yenrosagala/fasih-analytics:latest
    container_name: fasih-analytics
    ports:
      - "8080:8080"
    volumes:
      # Host data + config + FASIH session (session files are NOT baked into the image).
      - ./inputs:/app/inputs
      # Serve and persist refreshed payloads on the host.
      - ./outputs:/app/outputs
    environment:
      # Login gate. Change these in a .env file next to this compose file
      # (LOGIN_USER=... / LOGIN_PASSWORD=...). Both must be set to enable login.
      LOGIN_USER: ${LOGIN_USER:-admin}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-admin123}
      # Optional: enables the "Ringkas dengan AI" button on the Progress tab.
      # Set GEMINI_API_KEY=... in .env. Only aggregate numbers are sent to Gemini.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped
